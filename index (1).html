<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Essential Kits · Rinwear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ec;--surface:#fff;--ink:#14211b;--muted:#5b6a62;--accent:#0f6b46;--on-accent:#fff;--line:rgba(15,107,70,.2);--radius:8px;--relief:0 1px 0 #fff inset,0 12px 22px -14px rgba(15,107,70,.5),0 2px 0 rgba(15,107,70,.16);--head:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--hstyle:italic;--htrack:.01em;--hcase:uppercase}
body[data-theme="rin"]{--bg:#e9e6df;--surface:#f7f5f0;--ink:#151515;--muted:#6b675f;--accent:#2b3cff;--on-accent:#fff;--line:rgba(21,21,21,.18);--radius:20px;--relief:0 5px 0 #6e0e1e,0 16px 24px -12px rgba(110,14,30,.5);--head:"Syne","Helvetica Neue",Arial,sans-serif;--hstyle:normal;--htrack:-.03em;--hcase:none}
body[data-theme="rin"] .card:nth-child(even){--relief:0 5px 0 #101c6e,0 16px 24px -12px rgba(16,28,110,.5)}
body[data-theme="may"]{--bg:#09090b;--surface:#151518;--ink:#f4f1f8;--muted:#a79fb5;--accent:#7c3aed;--on-accent:#fff;--line:rgba(167,139,250,.28);--radius:14px;--relief:0 5px 0 #4c1d95,0 16px 26px -12px rgba(124,58,237,.6);--head:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--hstyle:normal;--htrack:.02em;--hcase:uppercase}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif;transition:background-color .7s ease,color .7s ease;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);transition:background-color .7s}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}
.switch{flex:1;display:flex;gap:2px;padding:4px;border:1px solid var(--line);border-radius:999px;position:relative}
.switch button{flex:1 1 auto;white-space:nowrap;background:none;border:0;padding:10px 8px;min-height:44px;border-radius:999px;font-weight:700;font-size:.85rem;position:relative;z-index:1;transition:color .4s}
.switch button[aria-selected="true"]{color:var(--on-accent)}
.pill{position:absolute;top:4px;bottom:4px;left:4px;border-radius:999px;background:var(--accent);transition:transform .5s cubic-bezier(.7,0,.2,1),width .5s cubic-bezier(.7,0,.2,1),background-color .7s}
.paylink{display:none;color:var(--muted);text-decoration:none;font-weight:500;padding:10px 4px}
.paylink i{display:none;font-style:normal}
.hero{padding:32px 0 14px;position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:1}
.hero h1{font-family:var(--head);font-style:var(--hstyle);text-transform:var(--hcase);letter-spacing:var(--htrack);font-weight:800;font-size:clamp(3.2rem,16vw,8.5rem);line-height:.92}
.hero p{max-width:46ch;color:var(--muted);margin-top:14px}
.pitch{position:absolute;right:-30px;top:14px;width:64vw;max-width:420px;opacity:.12;transition:opacity .6s}
body:not([data-theme="kits"]) .pitch{opacity:0}
.tape{display:none;position:absolute;right:20px;top:30px;font:800 7rem/1 var(--head);color:transparent;-webkit-text-stroke:1.5px var(--ink);opacity:.3;transform:rotate(-8deg)}
.filters{display:flex;gap:8px;padding:10px 16px 18px;overflow-x:auto;scrollbar-width:none;max-width:1120px;margin:0 auto}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap;background:none;border:1px solid var(--line);border-radius:999px;padding:10px 16px;min-height:44px;font-weight:500;transition:background-color .3s,color .3s,border-color .3s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-bottom:56px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--relief);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;transition:background-color .7s,border-color .7s,border-radius .7s,box-shadow .7s,transform .25s}
.shot{aspect-ratio:4/5;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 5%,transparent);position:relative;overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover}
.shot svg{width:64%;filter:drop-shadow(0 10px 12px rgba(0,0,0,.22))}
.tag{position:absolute;top:8px;left:8px;background:var(--accent);color:var(--on-accent);font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;transition:background-color .7s}
.info{padding:12px;display:flex;flex-direction:column;gap:6px}
.info h3{font:var(--hstyle) 700 1.1rem/1.1 var(--head);text-transform:var(--hcase);letter-spacing:var(--htrack)}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:6px;color:var(--muted);font-size:.85rem}
.price{color:var(--ink);font-weight:700}
.empty{grid-column:1/-1;color:var(--muted);padding:32px 0}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.sizes label{cursor:pointer}
.sizes input{position:absolute;opacity:0}
.sizes span{display:grid;place-items:center;min-width:48px;height:44px;border:1px solid var(--line);border-radius:calc(var(--radius)/2 + 4px);font-weight:500;transition:all .25s}
.sizes input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sizes input:focus-visible+span{outline:3px solid var(--accent)}
.order{background:var(--accent);color:var(--on-accent);border:0;border-radius:calc(var(--radius)/2 + 4px);padding:14px;min-height:48px;font-weight:700;text-align:center;text-decoration:none;display:block;transition:transform .2s,background-color .7s}
.pay{border-top:1px solid var(--line);padding:44px 0 calc(64px + env(safe-area-inset-bottom))}
.pay h2{font:var(--hstyle) 800 clamp(2rem,9vw,3.2rem)/1 var(--head);text-transform:var(--hcase);letter-spacing:var(--htrack);margin-bottom:8px}
.pay .wrap>p{color:var(--muted);margin-bottom:20px;max-width:52ch}
.paybox{display:grid;gap:10px}
.field{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:background-color .7s}
.field small{display:block;color:var(--muted)}
.field b{font-weight:700;word-break:break-all}
.copy{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px;font-size:.85rem}
/* Página de producto */
.sheet{position:fixed;inset:0;z-index:20;visibility:hidden;transition:visibility 0s .45s}
.sheet.open{visibility:visible;transition-delay:0s}
.scrim{position:absolute;inset:0;background:rgba(10,15,12,.55);opacity:0;transition:opacity .4s}
.open .scrim{opacity:1}
.panel{position:absolute;inset:0;background:var(--bg);color:var(--ink);transform:translateY(6%);opacity:0;transition:transform .45s cubic-bezier(.2,.7,.2,1),opacity .35s,background-color .7s}
.open .panel{transform:none;opacity:1}
.pscroll{height:100%;overflow-y:auto;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom)}
.close{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:2;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:1.4rem;line-height:1}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/5;display:grid;place-items:center;position:relative;background:color-mix(in srgb,var(--ink) 5%,transparent);overflow:hidden}
.slide img{width:100%;height:100%;object-fit:cover}
.slide svg{width:68%;filter:drop-shadow(0 14px 16px rgba(0,0,0,.25))}
.slide svg.zoom{width:150%;max-width:none;margin-top:30%}
.lab{position:absolute;bottom:12px;left:14px;color:var(--muted);font-size:.85rem}
.thumbs{display:flex;gap:8px;padding:10px 16px;overflow-x:auto}
.thumbs button{flex:none;width:56px;height:56px;padding:4px;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--radius)/2 + 2px)}
.thumbs button[aria-current="true"]{border:2px solid var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs svg{width:100%;height:100%}
.dinfo{padding:8px 16px 40px;display:flex;flex-direction:column;gap:12px}
.dinfo h2{font:var(--hstyle) 800 2.2rem/1 var(--head);text-transform:var(--hcase);letter-spacing:var(--htrack)}
.dinfo .cat{color:var(--muted)}
.dinfo .price{font-size:1.5rem}
.dinfo .desc{color:var(--muted);max-width:52ch}
.lbl{font-weight:700}
.note{color:var(--muted);font-size:.9rem}
.pk{position:relative;display:block;width:68%;aspect-ratio:1}.pk svg{position:absolute;width:62%;height:auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}.pk svg:nth-child(1){left:2%;top:22%}.pk svg:nth-child(2){left:36%;top:0}.pk svg:nth-child(3){left:20%;top:30%}.thumbs .pk{width:100%;height:100%}
.swap{animation:in .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (min-width:600px){
  .paylink{display:block}.paylink i{display:inline}.switch{flex:none}.switch button{flex:none;padding:10px 18px;font-size:.95rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
  .info{padding:16px;gap:8px}.info h3{font-size:1.35rem}
  .paybox{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .wrap{padding:0 24px}.filters{padding:10px 24px 24px}
}
@media (min-width:800px){
  .hero{padding:64px 0 32px}
  .pitch{opacity:.14}
  body[data-theme="rin"] .tape{display:block}
  .panel{inset:4vh 0;margin:0 auto;width:min(980px,92vw);border-radius:var(--radius);overflow:hidden}
  .pscroll{display:grid;grid-template-columns:1.05fr 1fr;align-items:start}
  .dinfo{padding:56px 32px 32px}
}
@media (hover:hover){.card:hover{transform:translateY(-3px)}.order:hover{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto}}
</style>
</head>
<body data-theme="kits">

<header>
  <div class="wrap bar">
    <nav class="switch" role="tablist" aria-label="Colecciones">
      <span class="pill" id="pill"></span>
      <button role="tab" id="t-kits" aria-selected="true" data-brand="kits">Essential Kits</button>
      <button role="tab" id="t-rin" aria-selected="false" data-brand="rin">Rinwear</button>
      <button role="tab" id="t-may" aria-selected="false" data-brand="may">Mayoreo</button>
    </nav>
    <a class="paylink" href="#pago"><i>Datos de </i>pago</a>
  </div>
</header>

<main>
  <section class="hero"><div class="wrap" id="hero"></div>
    <svg class="pitch" viewBox="0 0 200 130" fill="none" stroke="#0f6b46" stroke-width="2" aria-hidden="true"><rect x="2" y="2" width="196" height="126"/><line x1="100" y1="2" x2="100" y2="128"/><circle cx="100" cy="65" r="18"/><rect x="2" y="37" width="30" height="56"/><rect x="168" y="37" width="30" height="56"/></svg>
    <div class="tape" aria-hidden="true">RW</div>
  </section>
  <div class="filters" id="filters" role="group" aria-label="Filtrar"></div>
  <div class="wrap"><div class="grid" id="grid"></div></div>
</main>

<section class="pay" id="pago">
  <div class="wrap">
    <h2>Datos de pago</h2>
    <p>Elige tu playera, mándanos el pedido por WhatsApp y haz tu transferencia con estos datos. Envía tu comprobante en el mismo chat.</p>
    <div class="paybox" id="paybox"></div>
  </div>
</section>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Producto" aria-hidden="true">
  <div class="scrim" data-close></div>
  <div class="panel">
    <button class="close" data-close aria-label="Cerrar">×</button>
    <div class="pscroll" id="pscroll"></div>
  </div>
</div>

<script>
/* ============ PERSONALIZA AQUÍ ============ */
const CONFIG = {
  whatsapp: "527291084707",             // código de país (52) + número, sin + ni espacios
  pago: {
    Banco: "BBVA",
    Titular: "Julián Raúl Rivera Nuño",
    CLABE: "012 180 01545009095",
    Concepto: "Tu nombre + pedido"
  },
  /* Se agrega al final del mensaje de WhatsApp para que el cliente lo complete */
  envio: ["Nombre", "DIRECCIÓN", "Número Casa", "Área", "Provincia/Estado", "Ciudad", "Nación", "Teléfono", "Código Postal"],
  brands: {
    kits: { title: "Essential Kits", text: "Playeras de fútbol de clubes, selecciones y retro. Elige tu talla y pídela por WhatsApp.",
            cats: ["Todas", "Clubes", "Selecciones", "Retro"] },
    rin:  { title: "Rinwear", text: "Playeras de marca para todos los días. Streetwear con carácter y casuales que combinan con todo.",
            cats: ["Todas", "Streetwear", "Casual"] },
    may:  { title: "Mayoreo", text: "Paquetes de playeras para revender. Elige tu paquete y pídelo por WhatsApp; ahí confirmamos modelos, tallas y disponibilidad.",
            cats: ["Todas", "Fútbol", "Rinwear", "Mixto"] }
  }
};
/* imgs: lista de fotos de la playera (la primera se ve en la tarjeta), ej. ["img/local1.jpg","img/local2.jpg"].
   Si la dejas vacía se muestran playeras de color como ejemplo. */
const PRODUCTS = [
  { brand:"kits", cat:"Clubes",      name:"Jersey local 24/25",   price:699, sizes:["S","M","L","XL"], color:"#c8102e", imgs:[], tag:"Nuevo", desc:"Versión aficionado, tela ligera y escudo bordado. Corte regular." },
  { brand:"kits", cat:"Clubes",      name:"Jersey visita 24/25",  price:699, sizes:["S","M","L","XL"], color:"#e4e0d4", imgs:[], tag:"", desc:"Versión aficionado en color claro. Corte regular." },
  { brand:"kits", cat:"Selecciones", name:"Selección local",      price:749, sizes:["M","L","XL"],     color:"#0a7d3b", imgs:[], tag:"", desc:"Playera de selección con cuello en V y detalles bordados." },
  { brand:"kits", cat:"Retro",       name:"Clásico 98",           price:799, sizes:["M","L"],          color:"#f5c400", imgs:[], tag:"Retro", desc:"Réplica retro con cuello clásico y tela suave." },
  { brand:"rin",  cat:"Streetwear",  name:"Oversize Graphic Tee", price:499, sizes:["S","M","L","XL"], color:"#151515", imgs:[], tag:"Nuevo", desc:"Corte oversize en algodón grueso con gráfico al frente." },
  { brand:"rin",  cat:"Streetwear",  name:"Boxy Washed",          price:549, sizes:["M","L","XL"],     color:"#6b675f", imgs:[], tag:"", desc:"Corte boxy con acabado lavado." },
  { brand:"rin",  cat:"Casual",      name:"Básica Essential",     price:329, sizes:["S","M","L","XL"], color:"#d8d3c8", imgs:[], tag:"", desc:"Básica de algodón suave para todos los días." },
  { brand:"rin",  cat:"Casual",      name:"Polo Clásico",         price:459, sizes:["S","M","L"],      color:"#2b3cff", imgs:[], tag:"", desc:"Polo de piqué con cuello estructurado." },
  /* Paquetes de mayoreo: sin tallas, el cliente las define por WhatsApp. colors = 3 colores del dibujo de ejemplo */
  { brand:"may", cat:"Fútbol",  name:"Paquete 5 playeras",  price:2999,  colors:["#c8102e","#0a7d3b","#e4e0d4"], imgs:[], tag:"5 piezas",  desc:"Cinco playeras de fútbol para reventa. Confirmamos modelos y tallas por WhatsApp." },
  { brand:"may", cat:"Fútbol",  name:"Paquete 10 playeras", price:5490,  colors:["#f5c400","#0a7d3b","#c8102e"], imgs:[], tag:"10 piezas", desc:"Diez playeras de fútbol para reventa. Confirmamos modelos y tallas por WhatsApp." },
  { brand:"may", cat:"Rinwear", name:"Paquete 5 playeras",  price:1890,  colors:["#151515","#6b675f","#2b3cff"], imgs:[], tag:"5 piezas",  desc:"Cinco playeras Rinwear, streetwear y casuales. Confirmamos modelos y tallas por WhatsApp." },
  { brand:"may", cat:"Rinwear", name:"Paquete 10 playeras", price:3490,  colors:["#2b3cff","#151515","#d8d3c8"], imgs:[], tag:"10 piezas", desc:"Diez playeras Rinwear, streetwear y casuales. Confirmamos modelos y tallas por WhatsApp." },
  { brand:"may", cat:"Mixto",   name:"Paquete 20 playeras", price:6490,  colors:["#c8102e","#151515","#f5c400"], imgs:[], tag:"20 piezas", desc:"Veinte playeras mezclando fútbol y Rinwear. Confirmamos modelos y tallas por WhatsApp." },
  { brand:"may", cat:"Mixto",   name:"Paquete 50 playeras", price:14990, colors:["#0a7d3b","#2b3cff","#e4e0d4"], imgs:[], tag:"50 piezas", desc:"Cincuenta playeras mezclando fútbol y Rinwear para tu negocio. Confirmamos modelos y tallas por WhatsApp." }
];
/* ========================================= */

const $ = s => document.querySelector(s);
const state = { brand:"kits", cat:"Todas" };
const money = n => "$" + n.toLocaleString("es-MX") + " MXN";
const shirt = (c, cls="") => `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true"><path d="M32 8 8 22l9 18 11-5v57h44V35l11 5 9-18L68 8c-4 9-12 13-18 13S36 17 32 8z" fill="${c}" stroke="rgba(0,0,0,.25)" stroke-width="1.5"/></svg>`;
const photos = p => p.imgs && p.imgs.length ? p.imgs.map(src => ({src})) : (p.brand==="may" ? ["Paquete","Contenido","Detalle"] : ["Frente","Espalda","Detalle"]).map(label => ({label}));
const pack = p => `<span class="pk" aria-hidden="true">${(p.colors || ["#888","#555","#aaa"]).map(c => shirt(c)).join("")}</span>`;
const vis = (p, k=0) => p.brand==="may" ? pack(p) : shirt(p.color, k===2 ? "zoom" : "");
let opener = null;

function waLink(p, size){
  const brand = CONFIG.brands[p.brand].title;
  const msg = p.sizes
    ? `Hola, quiero pedir: ${p.name} (${brand}), talla ${size}, ${money(p.price)}. ¿Está disponible?`
    : `Hola, quiero pedir: ${p.name} (${brand}), ${money(p.price)}. ¿Qué modelos y tallas tienen disponibles?`;
  const envio = CONFIG.envio.map(c => c + ": ").join("\n");
  return `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg + "\n\n" + envio)}`;
}

function render(){
  const b = CONFIG.brands[state.brand];
  $("#hero").innerHTML = `<div class="swap"><h1>${b.title}</h1><p>${b.text}</p></div>`;
  $("#filters").innerHTML = b.cats.map(c => `<button class="chip" aria-pressed="${c===state.cat}" data-cat="${c}">${c}</button>`).join("");
  const list = PRODUCTS.filter(p => p.brand===state.brand && (state.cat==="Todas" || p.cat===state.cat));
  $("#grid").innerHTML = list.length ? list.map((p,n) => {
    const i = PRODUCTS.indexOf(p), f = photos(p)[0];
    return `<a class="card swap" href="#p-${i}" data-i="${i}" style="animation-delay:${n*60}ms" aria-label="Ver ${p.name}">
      <div class="shot">${f.src ? `<img src="${f.src}" alt="${p.name}" loading="lazy">` : vis(p)}${p.tag ? `<span class="tag">${p.tag}</span>` : ""}</div>
      <div class="info"><h3>${p.name}</h3><div class="meta"><span>${p.cat}</span><span class="price">${money(p.price)}</span></div></div>
    </a>`;
  }).join("") : `<p class="empty">Aún no hay playeras en esta categoría.</p>`;
}

function movePill(){
  const t = $("#t-" + state.brand), pill = $("#pill");
  pill.style.width = t.offsetWidth + "px";
  pill.style.transform = `translateX(${t.offsetLeft - 4}px)`;
}
function applyBrand(){
  document.body.dataset.theme = state.brand;
  document.querySelectorAll(".switch [role=tab]").forEach(t => t.setAttribute("aria-selected", t.dataset.brand===state.brand));
  movePill(); render();
}
function setBrand(b){
  if(b===state.brand) return;
  const f = () => { state.brand = b; state.cat = "Todas"; applyBrand(); scrollTo({top:0}); };
  document.startViewTransition ? document.startViewTransition(f) : f();
}

/* Página de producto */
function show(i){
  const p = PRODUCTS[i];
  if(p.brand!==state.brand){ state.brand = p.brand; state.cat = "Todas"; applyBrand(); }
  const g = photos(p);
  $("#pscroll").innerHTML = `
    <div class="gal">
      <div class="slides" id="slides">${g.map((x,k) => `<div class="slide">${x.src ? `<img src="${x.src}" alt="${p.name}, foto ${k+1}">` : `${vis(p,k)}<span class="lab">${x.label}</span>`}</div>`).join("")}</div>
      <div class="thumbs">${g.map((x,k) => `<button data-k="${k}" aria-label="Ver foto ${k+1}" aria-current="${k===0}">${x.src ? `<img src="${x.src}" alt="">` : vis(p)}</button>`).join("")}</div>
    </div>
    <div class="dinfo">
      <p class="cat">${p.cat}</p>
      <h2>${p.name}</h2>
      <p class="price">${money(p.price)}</p>
      <p class="desc">${p.desc || ""}</p>
      ${p.sizes ? `<p class="lbl">Talla</p>
      <div class="sizes" role="radiogroup" aria-label="Talla">${p.sizes.map((s,j) => `<label><input type="radio" name="ds" value="${s}" ${j===0?"checked":""}><span>${s}</span></label>`).join("")}</div>` : ""}
      <a class="order" id="order" target="_blank" rel="noopener" href="${waLink(p, p.sizes ? p.sizes[0] : "")}">Pedir por WhatsApp</a>
      <p class="note">El pago es por transferencia. <a href="#pago" id="topay">Ver datos de pago</a></p>
    </div>`;
  $("#pscroll").dataset.i = i;
  $("#pscroll").scrollTop = 0;
  $("#slides").addEventListener("scroll", e => {
    const k = Math.round(e.target.scrollLeft / e.target.clientWidth);
    document.querySelectorAll(".thumbs button").forEach((t,n) => t.setAttribute("aria-current", n===k));
  }, {passive:true});
  $("#sheet").classList.add("open");
  $("#sheet").setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";
  $(".close").focus({preventScroll:true});
}
function hide(){
  if(!$("#sheet").classList.contains("open")) return;
  $("#sheet").classList.remove("open");
  $("#sheet").setAttribute("aria-hidden","true");
  document.body.style.overflow = "";
  if(opener) opener.focus({preventScroll:true});
}
const go = i => { history.pushState({open:1}, "", "#p-" + i); show(i); };
function shut(){
  if(history.state && history.state.open) history.back();
  else { history.replaceState(null, "", location.pathname + location.search); hide(); }
}
function sync(){
  const m = location.hash.match(/^#p-(\d+)$/);
  m && PRODUCTS[+m[1]] ? show(+m[1]) : hide();
}

document.querySelectorAll(".switch [role=tab]").forEach(t => t.addEventListener("click", () => setBrand(t.dataset.brand)));
$("#filters").addEventListener("click", e => { const c = e.target.closest("[data-cat]"); if(c){ state.cat = c.dataset.cat; render(); } });
$("#grid").addEventListener("click", e => {
  const a = e.target.closest("a.card"); if(!a) return;
  e.preventDefault(); opener = a; go(+a.dataset.i);
});
$("#sheet").addEventListener("click", e => {
  if(e.target.closest("[data-close]")) return shut();
  if(e.target.closest("#topay")){ e.preventDefault(); shut(); setTimeout(() => $("#pago").scrollIntoView({behavior:"smooth"}), 60); return; }
  const t = e.target.closest(".thumbs button");
  if(t){ const s = $("#slides"); s.scrollTo({left: s.clientWidth * +t.dataset.k, behavior:"smooth"}); }
});
$("#sheet").addEventListener("change", e => {
  if(e.target.type==="radio") $("#order").href = waLink(PRODUCTS[$("#pscroll").dataset.i], e.target.value);
});
addEventListener("keydown", e => { if(e.key==="Escape") shut(); });
addEventListener("popstate", sync);

$("#paybox").innerHTML = Object.entries(CONFIG.pago).map(([k,v]) =>
  `<div class="field"><div><small>${k}</small><b>${v}</b></div><button class="copy" data-v="${v.replace(/\s/g,"")}">Copiar</button></div>`).join("");
$("#paybox").addEventListener("click", e => {
  const b = e.target.closest(".copy"); if(!b) return;
  navigator.clipboard.writeText(b.dataset.v).then(() => { b.textContent = "Copiado"; setTimeout(() => b.textContent = "Copiar", 1400); });
});

addEventListener("resize", movePill);
document.fonts.ready.then(movePill);
render(); movePill(); sync();
</script>
</body>
</html>
